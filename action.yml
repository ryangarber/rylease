name: rylease
description: A release pipeline that doesn't fight you.
author: Ryan Garber
branding:
  icon: tag
  color: green
inputs:
  steps:
    description: >
      The steps to run, as a YAML list, like a workflow's: each entry `uses` a
      step or preset, passes it options `with`, and may run only `if` an
      expression holds. Steps can be bundled ones, paths to files
      (./release/announce.ts), or installed packages (pkg or pkg#export).
    default: "- uses: conventional"
  dry-run:
    description: Run every step without side effects, reporting what each would do.
    default: "false"
  version:
    description: >
      A version that's already been released, e.g. by an earlier job. Only the
      `release` steps run, for this version, such as uploading files to its
      GitHub release.
    default: ""
  notes:
    description: The release notes, along with `version`.
    default: ""
  working-directory:
    description: The project to release, relative to the workspace.
    default: "."
  summary:
    description: Write a summary of the release to the job's page.
    default: "true"
  token:
    description: Used for GitHub API calls when GITHUB_TOKEN isn't set.
    default: ${{ github.token }}
outputs:
  status:
    description: "`released`, `unchanged` or `failed`."
  released:
    description: "`true` when there was something to release (in a dry run, when there would have been)."
  previous-version:
    description: The version before this release.
  version:
    description: The released version, when there was one.
  kind:
    description: "`major`, `minor`, `patch` or `none`."
  notes:
    description: The release notes.
runs:
  using: node24
  main: dist/action.mjs
