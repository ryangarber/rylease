name: release

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dry run on every push to main; release for real when dispatched.
      - uses: ./
        with:
          dry-run: ${{ github.event_name != 'workflow_dispatch' }}
          steps: |
            - uses: conventional
              with:
                git-commit: { move: ["v{major}"] }
